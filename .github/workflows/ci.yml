name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: logs_user
          POSTGRES_PASSWORD: logs_password
          POSTGRES_DB: logs_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logs_user -d logs_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://logs_user:logs_password@localhost:5432/logs_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migrate

      - name: Test
        run: npm test
